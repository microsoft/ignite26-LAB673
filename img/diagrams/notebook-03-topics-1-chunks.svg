<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Topic graph, step 1: compare chunk embeddings</title>
<desc>Seven chunk cards from the PDFs. Chunks with similar embeddings sit close together and are joined by dashed lines, forming two loose groups. One chunk has no close match and won&#x27;t join a topic. Chunks are text from the original PDFs, not entities or extracted facts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker></defs>
<rect width="960" height="490" fill="#ffffff"/>
<circle cx="52" cy="46" r="22" fill="#0b7285" stroke="none" stroke-width="2"/>
<text x="52" y="47" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central"><tspan x="52" dy="0">1</tspan></text>
<text x="90" y="47" font-size="28" font-weight="600" fill="#212529" text-anchor="start" dominant-baseline="central"><tspan x="90" dy="0">Compare chunk embeddings</tspan></text>
<text x="90" y="82" font-size="22" font-weight="normal" fill="#495057" text-anchor="start" dominant-baseline="hanging"><tspan x="90" dy="0">Each card is one chunk of text from a PDF.</tspan></text>
<path d="M 640 128 L 700 128" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<text x="712" y="128" font-size="20" font-weight="normal" fill="#0b7285" text-anchor="start" dominant-baseline="central"><tspan x="712" dy="0">similar embeddings</tspan></text>
<path d="M 135 200 L 315 180" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M 315 180 L 225 300" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M 225 300 L 135 200" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M 635 190 L 825 200" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M 825 200 L 725 305" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<path d="M 725 305 L 635 190" fill="none" stroke="#0b7285" stroke-width="3" stroke-dasharray="7 6"/>
<rect x="70" y="170" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="135" y="201" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="135" dy="0">chunk</tspan></text>
<rect x="250" y="150" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="315" y="181" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="315" dy="0">chunk</tspan></text>
<rect x="160" y="270" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="225" y="301" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="225" dy="0">chunk</tspan></text>
<rect x="570" y="160" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="635" y="191" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="635" dy="0">chunk</tspan></text>
<rect x="760" y="170" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="825" y="201" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="825" dy="0">chunk</tspan></text>
<rect x="660" y="275" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="725" y="306" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="725" dy="0">chunk</tspan></text>
<rect x="415" y="300" width="130" height="60" rx="10" fill="#f8f9fa" stroke="#868e96" stroke-width="2" stroke-dasharray="8 6"/>
<text x="480" y="331" font-size="20" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="480" dy="0">chunk</tspan></text>
<text x="480" y="372" font-size="20" font-weight="normal" fill="#868e96" text-anchor="middle" dominant-baseline="hanging"><tspan x="480" dy="0">no close match:</tspan><tspan x="480" dy="26.0">not in any topic</tspan></text>
<text x="480.0" y="458" font-size="22" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="central"><tspan x="480.0" dy="0">Chunks are text from the original PDFs, not entities or extracted facts.</tspan></text>
