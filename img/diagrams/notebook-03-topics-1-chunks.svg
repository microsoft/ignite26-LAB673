<circle cx="52" cy="46" r="22" fill="#0b7285" stroke="none" stroke-width="2"/>
<text x="52" y="47" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central"><tspan x="52" dy="0">1</tspan></text>
<text x="90" y="47" font-size="28" font-weight="600" fill="#212529" text-anchor="start" dominant-baseline="central"><tspan x="90" dy="0">Cluster chunks based on embeddings</tspan></text>
<rect x="35" y="105" width="570" height="285" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="3" stroke-dasharray="8 6"/>
<text x="55" y="118" font-size="20" font-weight="600" fill="#0b7285" text-anchor="start" dominant-baseline="hanging"><tspan x="55" dy="0">broad cluster</tspan></text>
<rect x="60" y="155" width="240" height="190" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="2" stroke-dasharray="8 6"/>
<text x="80" y="168" font-size="18" font-weight="600" fill="#0b7285" text-anchor="start" dominant-baseline="hanging"><tspan x="80" dy="0">cluster A</tspan></text>
