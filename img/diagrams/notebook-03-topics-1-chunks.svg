<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Topic graph, step 1: cluster chunks based on embeddings</title>
<desc>Chunk embeddings form a hierarchy of clusters. Two tight clusters, A and B, sit inside one broad cluster. A separate cluster, C, stands alone. One chunk has no close match and won&#x27;t join a topic. Chunks are text from the original PDFs, not entities or extracted facts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker></defs>
