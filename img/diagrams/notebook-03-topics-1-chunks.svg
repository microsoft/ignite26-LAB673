<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Topic graph, step 1: cluster chunks based on embeddings</title>
<desc>Each chunk is linked to its most similar chunks by comparing embeddings. The clustering method groups strongly linked chunks into a broad cluster, then splits it into tighter clusters, A and B. It also finds a separate cluster, C. One chunk has no strong links, so it isn&#x27;t clustered. Chunks are text from the original PDFs, not entities or extracted facts.</desc>
