<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 572" width="1360" height="572" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="topics-overview-title topics-overview-desc">
<title id="topics-overview-title">Topics overview: compare chunk embeddings, form topics and centroids, then navigate the Sitemap and read evidence</title>
<desc id="topics-overview-desc">Three panels flow left to right. Panel 1: chunks of the original PDFs are compared by their embeddings, and similar chunks are connected; these are chunks, not entities or extracted facts. Panel 2: similar chunks form a two-level hierarchy. A broad topic at level 0 contains narrow topics A and B at level 1, and another broad topic has no children. Each terminal topic has a centroid, its representative vector; the broad topic's centroid is derived from its children. Similarity groups chunks; it does not assert facts, and titles describe a group without defining it. Panel 3: the Sitemap leads from a broad topic to narrower topics. A centroid search over all source chunks returns centroid-nearest examples for browsing, not stored membership. Reading the original chunks and source records provides the evidence. Footer: Topics guide where to look. Source chunks provide the evidence.</desc>
