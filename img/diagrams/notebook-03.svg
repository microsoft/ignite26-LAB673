<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 750" width="1100" height="750" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Notebook 03: the topic graph knowledge source and its ontology</title>
<desc>cocoarynth-topics-knowledge-base uses cocoarynth-topics-knowledge-source, whose graphOntology is the cocoarynth-sitemap.owl ontology converted to inline JSON-LD. The knowledge source searches the cocoarynth-topics index: 54 facts about 8 topics, including 6 centroid vectors linked by HasRootTopic and HasSubTopic. A separate centroid search finds nearby chunks in cocoarynth-chunks.</desc>
