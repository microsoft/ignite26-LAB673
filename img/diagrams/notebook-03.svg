<text x="310.0" y="119.80000000000001" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="310.0" dy="0">MR1 + gpt-6-luna</tspan><tspan x="310.0" dy="28.6">answer synthesis</tspan></text>
