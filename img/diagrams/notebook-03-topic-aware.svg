<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Notebook 03: the topic-aware knowledge source</title>
<desc>cocoarynth-topic-aware-knowledge-base uses cocoarynth-topic-aware-knowledge-source, whose topicGraph kind is diverse. The knowledge source searches the cocoarynth-chunks index. Its text_vector field uses the cocoarynth-topic-graph profile, which points to the topic centroids in the cocoarynth-topics index.</desc>
