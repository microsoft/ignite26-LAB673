<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Non-diversified and diversified vector search with the topic graph</title>
<desc>One query vector feeds two result lists of six chunks. Each chunk is labeled with its nearest topic centroid, A to D, found at query time. The non-diversified list is ranked by similarity score, and four of its six chunks are nearest topic A. The diversified search gathers a larger pool of similar chunks and picks from the topics in rounds, so its list covers topics A, B, C, and D. It keeps each chunk&#x27;s original score and returns chunks in pick order, so two close topic A matches are replaced by chunks nearest other topics.</desc>
