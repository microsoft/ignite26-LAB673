<text x="712.0" y="736.8" font-size="20" font-weight="600" fill="#e67700" text-anchor="start" dominant-baseline="central"><tspan x="712.0" dy="0">centroid</tspan></text>
<text x="480.0" y="780" font-size="22" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="480.0" dy="0">Terminal topics have no subtopics and store a centroid.</tspan></text>
