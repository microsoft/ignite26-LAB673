<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" width="960" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Topic graph, step 2: build topics from clusters of chunks</title>
<desc>The broad cluster becomes a broad topic at level 0. Its tighter clusters, A and B, become subtopics at level 1. The standalone cluster, C, becomes a broad terminal topic. Each terminal topic stores a centroid vector. Similarity groups chunks; it doesn&#x27;t assert facts.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker></defs>
<rect width="960" height="720" fill="#ffffff"/>
<circle cx="52" cy="46" r="22" fill="#0b7285" stroke="none" stroke-width="2"/>
<text x="52" y="47" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central"><tspan x="52" dy="0">2</tspan></text>
<text x="90" y="47" font-size="28" font-weight="600" fill="#212529" text-anchor="start" dominant-baseline="central"><tspan x="90" dy="0">Build topics from clusters of chunks</tspan></text>
<rect x="35" y="115" width="390" height="285" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="3" stroke-dasharray="8 6"/>
<text x="55" y="128" font-size="20" font-weight="600" fill="#0b7285" text-anchor="start" dominant-baseline="hanging"><tspan x="55" dy="0">broad cluster</tspan></text>
<rect x="55" y="170" width="165" height="190" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="2" stroke-dasharray="8 6"/>
<text x="75" y="183" font-size="18" font-weight="600" fill="#0b7285" text-anchor="start" dominant-baseline="hanging"><tspan x="75" dy="0">cluster A</tspan></text>
<rect x="240" y="170" width="165" height="190" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="2" stroke-dasharray="8 6"/>
<text x="260" y="183" font-size="18" font-weight="600" fill="#0b7285" text-anchor="start" dominant-baseline="hanging"><tspan x="260" dy="0">cluster B</tspan></text>
<rect x="75" y="235" width="82" height="36" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="116" y="254" font-size="14" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="116" dy="0">chunk</tspan></text>
<rect x="120" y="300" width="82" height="36" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="161" y="319" font-size="14" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="161" dy="0">chunk</tspan></text>
<rect x="260" y="235" width="82" height="36" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="301" y="254" font-size="14" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="301" dy="0">chunk</tspan></text>
<rect x="305" y="300" width="82" height="36" rx="8" fill="#f8f9fa" stroke="#868e96" stroke-width="2"/>
<text x="346" y="319" font-size="14" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="central"><tspan x="346" dy="0">chunk</tspan></text>
<rect x="565" y="115" width="330" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="730.0" y="160.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="730.0" dy="0">Broad topic</tspan></text>
<text x="730.0" y="195.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="730.0" dy="0">formed from the broad cluster</tspan></text>
<rect x="638" y="102.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="730" y="115" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 0</text>
<rect x="485" y="315" width="205" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="587.5" y="360.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="587.5" dy="0">Subtopic A</tspan></text>
<text x="587.5" y="395.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="587.5" dy="0">formed from cluster A</tspan></text>
