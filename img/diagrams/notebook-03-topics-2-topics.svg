<text x="570.0" y="360.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="570.0" dy="0">Subtopic A</tspan></text>
<text x="570.0" y="395.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="570.0" dy="0">from cluster A</tspan></text>
