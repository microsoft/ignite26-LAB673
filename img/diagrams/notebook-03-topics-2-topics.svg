<rect x="565" y="500" width="330" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="730.0" y="545.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="730.0" dy="0">Broad topic</tspan></text>
<text x="730.0" y="580.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="730.0" dy="0">terminal: no subtopics</tspan></text>
<rect x="638" y="487.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="730" y="500" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 0</text>
<path d="M 335 563 L 563 563" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<text x="449" y="530" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="449" dy="0">creates</tspan></text>
<path d="M 547.5 441.8 L 547.5 463.8" fill="none" stroke="#e67700" stroke-width="2"/>
<circle cx="547.5" cy="475.8" r="12" fill="#e67700" stroke="none" stroke-width="2"/>
<text x="569.5" y="476.8" font-size="20" font-weight="600" fill="#e67700" text-anchor="start" dominant-baseline="central"><tspan x="569.5" dy="0">centroid</tspan></text>
<path d="M 777.5 441.8 L 777.5 463.8" fill="none" stroke="#e67700" stroke-width="2"/>
<circle cx="777.5" cy="475.8" r="12" fill="#e67700" stroke="none" stroke-width="2"/>
<text x="799.5" y="476.8" font-size="20" font-weight="600" fill="#e67700" text-anchor="start" dominant-baseline="central"><tspan x="799.5" dy="0">centroid</tspan></text>
<path d="M 690.0 626.8 L 690.0 648.8" fill="none" stroke="#e67700" stroke-width="2"/>
