<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 820" width="960" height="820" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Topic graph, step 2: build topics from clusters of chunks</title>
<desc>Each level of clusters becomes a level of topics. The broad cluster becomes a broad topic at level 0. The tighter clusters it was split into, A and B, become subtopics at level 1. The separate cluster, C, becomes a broad topic with no subtopics. Each terminal topic stores a centroid vector. Similarity groups chunks; it doesn&#x27;t assert facts.</desc>
