<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>Topic graph, step 2: group similar chunks into topics</title>
<desc>A broad topic at level 0 has two subtopics, A and B, at level 1. A second broad topic at level 0 has no subtopics. Topics without subtopics are terminal topics, and each terminal topic stores a centroid vector. Similarity groups chunks; it doesn&#x27;t assert facts. Titles describe a topic; they don&#x27;t define it.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#495057"/></marker></defs>
<rect width="960" height="600" fill="#ffffff"/>
<circle cx="52" cy="46" r="22" fill="#0b7285" stroke="none" stroke-width="2"/>
<text x="52" y="47" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central"><tspan x="52" dy="0">2</tspan></text>
<text x="90" y="47" font-size="28" font-weight="600" fill="#212529" text-anchor="start" dominant-baseline="central"><tspan x="90" dy="0">Group similar chunks into topics</tspan></text>
<text x="90" y="82" font-size="22" font-weight="normal" fill="#495057" text-anchor="start" dominant-baseline="hanging"><tspan x="90" dy="0">Topics have two levels. Terminal topics have no subtopics.</tspan></text>
<rect x="40" y="150" width="440" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="260.0" y="195.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="260.0" dy="0">Broad topic</tspan></text>
<text x="260.0" y="230.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="260.0" dy="0">has subtopics</tspan></text>
<rect x="168" y="137.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="260" y="150" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 0</text>
<rect x="560" y="150" width="360" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="740.0" y="195.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="740.0" dy="0">Broad topic</tspan></text>
<text x="740.0" y="230.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="740.0" dy="0">no subtopics: terminal</tspan></text>
<rect x="648" y="137.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="740" y="150" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 0</text>
<rect x="40" y="340" width="210" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="145.0" y="385.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="145.0" dy="0">Subtopic A</tspan></text>
<text x="145.0" y="420.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="145.0" dy="0">terminal</tspan></text>
<rect x="53" y="327.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="145" y="340" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 1</text>
<rect x="270" y="340" width="210" height="126.80000000000001" rx="10" fill="#e3fafc" stroke="#0b7285" stroke-width="2"/>
<text x="375.0" y="385.0" font-size="24" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="375.0" dy="0">Subtopic B</tspan></text>
<text x="375.0" y="420.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="375.0" dy="0">terminal</tspan></text>
<rect x="283" y="327.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="375" y="340" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 1</text>
<path d="M 260.0 276.8 L 145.0 325.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 260.0 276.8 L 375.0 325.0" fill="none" stroke="#495057" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 105.0 466.8 L 105.0 488.8" fill="none" stroke="#e67700" stroke-width="2"/>
<circle cx="105.0" cy="500.8" r="12" fill="#e67700" stroke="none" stroke-width="2"/>
<text x="127.0" y="501.8" font-size="20" font-weight="600" fill="#e67700" text-anchor="start" dominant-baseline="central"><tspan x="127.0" dy="0">centroid</tspan></text>
<path d="M 335.0 466.8 L 335.0 488.8" fill="none" stroke="#e67700" stroke-width="2"/>
<circle cx="335.0" cy="500.8" r="12" fill="#e67700" stroke="none" stroke-width="2"/>
<text x="357.0" y="501.8" font-size="20" font-weight="600" fill="#e67700" text-anchor="start" dominant-baseline="central"><tspan x="357.0" dy="0">centroid</tspan></text>
<path d="M 700.0 276.8 L 700.0 298.8" fill="none" stroke="#e67700" stroke-width="2"/>
<circle cx="700.0" cy="310.8" r="12" fill="#e67700" stroke="none" stroke-width="2"/>
<text x="722.0" y="311.8" font-size="20" font-weight="600" fill="#e67700" text-anchor="start" dominant-baseline="central"><tspan x="722.0" dy="0">centroid</tspan></text>
<text x="480.0" y="538" font-size="22" font-weight="600" fill="#212529" text-anchor="middle" dominant-baseline="hanging"><tspan x="480.0" dy="0">Similarity groups chunks; it doesn&#x27;t assert facts.</tspan><tspan x="480.0" dy="28.6">Titles describe a topic; they don&#x27;t define it.</tspan></text>
</svg>
