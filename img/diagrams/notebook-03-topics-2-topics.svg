<text x="817.5" y="395.2" font-size="22" font-weight="normal" fill="#495057" text-anchor="middle" dominant-baseline="hanging"><tspan x="817.5" dy="0">formed from cluster B</tspan></text>
<rect x="726" y="302.0" width="183" height="26" rx="13.0" fill="#0b7285"/>
<text x="818" y="315" font-size="18" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Topic · level 1</text>
