<rect x="35" y="500" width="300" height="125" rx="10" fill="#ffffff" stroke="#0b7285" stroke-width="3" stroke-dasharray="8 6"/>
<text x="55" y="513" font-size="20" font-weight="600" fill="#0b7285" text-anchor="start" dominant-baseline="hanging"><tspan x="55" dy="0">standalone cluster C</tspan></text>
