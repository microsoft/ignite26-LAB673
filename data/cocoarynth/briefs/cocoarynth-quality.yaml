index: cocoarynth-quality
description: Factory quality and production records - receiving procedure, bean tests, holds, lab certificates, sensory reports, batch records and nonconformances.

briefs:
  - id: bean-receiving-procedure
    title: "QP-04 Bean receiving and release procedure"
    type: procedure
    language: en
    date: 2026-01-05
    author: marcus-bell
    audience: Quality and warehouse staff
    pages: 3
    purpose: The rules every incoming bean lot must pass before it can be used.
    entities: [beans.receiving_limits]
    content:
      - Steps - weigh, inspect bags, sample, moisture, 300-bean cut test, sensory check, release or hold.
      - Limits - moisture 7.5% max; mouldy 3%, slaty 5%, insect-damaged 3% max; off-flavor rule (3 tasters).
      - Holds - lots over the moisture limit are re-dried in the conditioning room and retested; lots with off-flavors are rejected.
      - Release record and who signs it.
    visuals: []
    avoid: []

  - id: cut-test-register-2026
    title: "Bean receiving register 2026 (January–September)"
    type: register
    language: en
    date: 2026-09-30
    author: marcus-bell
    audience: Quality
    pages: 2
    purpose: One row per bean lot received in 2026 with moisture, cut-test counts and disposition.
    entities: [beans.lots]
    content:
      - Table of all lots - origin, received date, kg, moisture, cut-test counts, sensory, status, release/reject date.
      - Footnotes for MG26-L02 (hold and re-dry) and DR26-T02 (rejected on sensory).
    visuals: [{kind: chart, asset: cut-test-summary-2026}]
    avoid: [Causes of the hold or rejection]

  - id: hold-notice-mg26-l02
    title: "Hold notice H-2607-02: bean lot MG26-L02"
    type: form
    language: en
    date: 2026-07-28
    author: marcus-bell
    audience: Quality, Production, Sourcing
    pages: 1
    purpose: Formal hold placed on the Madagascar lot on arrival.
    entities: [beans.lots.MG26-L02, beans.consignments.CN-MG-2606]
    content:
      - Lot, 7 bags, 420 kg received 28 July; outer jute damp.
      - Moisture 8.6% against the 7.5% limit; cut test passed with mouldy 1.7% (higher than usual).
      - Disposition - hold; re-dry in the conditioning room; do not issue to production.
      - Production impact - limited-edition run planned for 30 July cannot start.
    visuals: [{kind: photo, asset: damp-jute-sacks}]
    avoid: []

  - id: redry-log-mg26-l02
    title: "Conditioning room log: re-drying MG26-L02"
    type: log
    language: en
    date: 2026-08-19
    author: lin-zhou
    audience: Quality
    pages: 2
    purpose: Daily moisture checks while the Madagascar lot was re-dried.
    entities: [beans.lots.MG26-L02, company.sites.conditioning-room]
    content:
      - Re-drying 3–14 August in shallow trays with dehumidification; daily moisture checks.
      - Retest on 19 August - 7.1%; mass after re-dry 413.2 kg.
    visuals: [{kind: chart, asset: redry-moisture-mg26-l02}, {kind: photo, asset: conditioning-room-trays}]
    avoid: []

  - id: lab-certificate-mg26-l02
    title: "Cascadia Food Labs certificate of analysis CFL-26-08-4471"
    type: lab_certificate
    language: en
    date: 2026-08-19
    author: cascadia-labs
    audience: Cocoarynth Quality
    pages: 1
    purpose: Independent moisture and microbiology results after re-drying.
    entities: [beans.lots.MG26-L02]
    content:
      - Sample received 19 August; moisture 7.1%.
      - Microbiology - total yeast and mould, Salmonella absent in 25 g, E. coli below detection (author realistic values within limits).
      - Conclusion - meets Cocoarynth specification.
    visuals: []
    avoid: []

  - id: release-record-mg26-l02
