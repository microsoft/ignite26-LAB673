  - id: retention-check-gh26-0706
    title: "Retention sample check: GH26-0706"
    type: form
    language: en
    date: 2026-07-20
    author: marcus-bell
    audience: Quality, Sales
    pages: 1
    purpose: Quality checks the factory's retained bars after the Larkspur complaint.
    entities: [production.batches.GH26-0706, retail.cases.CASE-2607-18]
    content:
      - All 10 retained bars glossy, even snap, no bloom.
      - Note that Steeple & Saucer and Pantry Lane received the same batch on direct routes and reported no issues.
      - Conclusion - the batch left the factory in good condition; look at what happened in transit.
    visuals: [{kind: photo, asset: glossy-bar}]
