    visuals: []
    avoid: []

  - id: sensory-rejection-dr26-t02
    title: "Sensory evaluation: trial lot DR26-T02"
    type: report
    language: en
    date: 2026-07-13
    author: devi-narayan
    audience: Quality and Sourcing
    pages: 1
    purpose: Tasting result that rejects the Dominican trial lot.
    entities: [beans.lots.DR26-T02, beans.lots.DR26-T01]
    content:
      - Bench roast and liquor tasting by 5 tasters.
      - 4 of 5 detected smoky, hammy notes (campfire, smoked ham on the finish); approved sample DR26-T01 did not have them.
      - Recommendation - reject under the sample-match clause.
    visuals: []
    avoid: [Cause on the farm]

  - id: ncr-2607-03-loma-verde
    title: "Nonconformance report NCR-2607-03"
    type: form
    language: en
    date: 2026-07-15
    author: marcus-bell
    audience: Quality and Sourcing
    pages: 2
    purpose: Nonconformance raised for the rejected trial lot, with the supplier response and closure added later.
    entities: [retail.cases.NCR-2607-03, beans.lots.DR26-T02, beans.lots.DR26-T03]
    content:
      - Section 1 (15 July) - rejection, disposition, supplier credited; supplier asked for root cause.
      - Section 2 (12 August) - supplier reports racks moved 30 m upwind and chimney raised (refers to the association's field visit without detail).
      - Section 3 (18 September) - follow-up sample DR26-T03 clean; NCR closed.
    visuals: [{kind: photo, asset: relocated-racks}]
    avoid: [Quoting the 4 m chimney distance (that is in the field notes)]

