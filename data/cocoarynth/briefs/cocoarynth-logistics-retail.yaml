  - id: riverbend-depot-handling-log-2026-07-14
    title: "Northwind Riverbend depot handling log, 14 July 2026"
    type: scanned_form
    language: en
    date: 2026-07-14
    author: dana-whitfield
    audience: Northwind operations
    pages: 2
    purpose: Depot clipboard log showing where pallet LM-P02 waited.
    entities: [retail.shipments.SHP-2607-031, company.sites.riverbend-bay-4, company.sites.riverbend-cold-room]
    content:
      - Several pallets logged that day; LM-P02 arrived 07:30, Cold Room 2 full with produce, placed in Overflow Bay 4 at 08:00, loaded onward 20:10.
      - Heat advisory noted at the top of the sheet.
      - Typed transcription page (text fallback for the scan).
    visuals: [{kind: scan, asset: depot-log-scan}, {kind: photo, asset: overflow-bay}]
    avoid: [Temperature readings]

  - id: logger-report-logger-04
    title: "Temperature logger report: LOGGER-04, Overflow Bay 4"
    type: report
    language: en
    date: 2026-07-16
    author: sam-okafor
    audience: Quality, Logistics
    pages: 2
    purpose: Download of the logger that sat beside pallet LM-P02.
    entities: [retail.loggers.LOGGER-04, retail.storage_guidance]
    content:
      - Chart of half-hourly readings 06:00–20:00 on 14 July.
      - Summary - minimum, maximum 34.1 °C at 14:30, time above 25 °C 11:30–17:30.
      - Reading table in an appendix.
      - Note that the logger measures air, not the inside of the bars.
    visuals: [{kind: chart, asset: logger-04}]
    avoid: [Conclusions about bloom]

