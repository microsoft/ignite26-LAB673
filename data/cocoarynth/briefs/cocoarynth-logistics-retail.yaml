  - id: northwind-incident-letter-2026-07-24
    title: "Northwind Cold Freight incident response: pallet LM-P02"
    type: letter
    language: en
    date: 2026-07-24
    author: northwind
    audience: Cocoarynth Logistics
    pages: 1
    purpose: Carrier acknowledges where the pallet was staged and commits to a fix.
    entities: [retail.shipments.SHP-2607-031, retail.cases.CASE-2607-18]
    content:
      - Pallet LM-P02 was staged in Overflow Bay 4 for about 12 hours during the heat advisory because Cold Room 2 was full.
      - Corrective action - never stage Cocoarynth pallets in overflow bays; call ahead when the cold room is full.
    visuals: []
    avoid: [Temperatures and the word "bloom"]

