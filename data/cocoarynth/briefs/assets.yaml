  - {name: wrapper-back-ec26-0811, from: wrapper-back-counter, batch: EC26-0811, quad: [[242, 318], [849, 316], [869, 532], [224, 536]], notes: "Printed back panel plus inkjet lot code, warped onto the wrapper."}
  - {name: ticket-scans, from: html, effect: scanned, notes: "Collection tickets T-0402, T-0417, T-0418: printed form plus Marisol Vega's handwriting (Caveat; Kalam for codes), farmer signatures (Nothing You Could Do); T-0418 water-stained."}
  - {name: field-notes-scan, from: code, effect: scanned, notes: "Notebook page in Yanelis Peña's handwriting (Reenie Beanie)."}
  - {name: depot-log-scan, from: html, effect: scanned, notes: "Riverbend RD-7 form; Dana Whitfield (Shadows Into Light), M.R. (Kalam, black), heat advisory in red marker."}
