  - id: informe-inspeccion-organica-nuevo-horizonte-2026
    title: "Informe de inspección orgánica anual, Cooperativa Agraria Nuevo Horizonte"
    type: inspection_report
    language: es
    date: 2026-04-22
    author: rafael-soto
    audience: Cooperative and certification committee
    pages: 3
    purpose: The certifier's inspection report with the buffer-zone finding that stalls the organic renewal.
    entities: [origins.inspections.insp-nh-2026-04, origins.certifications.cert-nh-organic, origins.farms.los-laureles, origins.farms.san-isidro]
    content:
      - Scope, farms visited, documents reviewed.
      - Major finding f-nh-01 - 3 m buffer with no hedge beside a neighbor's sprayed rice paddy; 8 m with barrier required.
      - Minor finding f-nh-02 on the input register.
      - Required corrective actions and deadline 31 August; renewal decision withheld until the major finding is verified.
    visuals: [{kind: photo, asset: buffer-strip-rice-paddy}]
    avoid: [Any statement that the bars may or may not carry a seal]

  - id: organic-status-update-nuevo-horizonte
    title: "Organic certificate status: Nuevo Horizonte (September 2026)"
    type: memo
    language: en
    date: 2026-09-01
    author: ana-ortega
    audience: Quality, Production and Sales
    pages: 1
    purpose: Sourcing update on where the Peru organic renewal stands.
    entities: [origins.certifications.cert-nh-organic, origins.inspections.insp-nh-2026-04]
    content:
      - Certificate CA-ORG-2025-0381 expired on 31 May 2026; renewal pending.
      - Cooperative submitted hedge-planting evidence on 28 August; certifier follow-up visit on 20 October.
      - Organic premium in the contract is suspended while the certificate is not valid.
      - Asks Production to follow the label-claims policy for new Peru batches.
    visuals: [{kind: photo, asset: inga-hedge-planting}]
    avoid: [Restating the policy rule itself - point to the label-claims policy instead]

  - id: tsaravola-buyer-visit-2026-05
    title: "Trip report: Tsaravola Estate, May 2026"
    type: trip_report
    language: en
    date: 2026-05-15
    author: ana-ortega
    audience: Sourcing and Quality
    pages: 2
    purpose: Buyer visit that notes the estate's limited covered drying space.
    entities: [origins.inspections.insp-ts-2026-05, origins.suppliers.tsaravola]
    content:
      - Tour of both parcels, fermentary and dryers.
      - Observation - the greenhouse dryer holds about half a peak-week harvest; open beds must be covered in rain.
      - Agreement to add a second greenhouse before 2027.
    visuals: [{kind: photo, asset: greenhouse-drying-rain}]
    avoid: []

  - id: tsaravola-harvest-report-2026-06
    title: "Tsaravola Estate harvest and drying report, June 2026"
    type: report
    language: en
    date: 2026-06-23
    author: hery-rakotomalala
    audience: Cocoarynth sourcing
    pages: 2
    purpose: The estate's own report on the June lot, including the rain that cut drying short.
    entities: [beans.lots.MG26-L02, beans.consignments.CN-MG-2606]
    content:
      - Harvest from both parcels; fermentation 6–12 June.
      - Drying 12–21 June interrupted by four days of rain; beans bagged a day early to meet the vessel.
      - Estate moisture-meter reading at bagging (author a value near 7.6%) with a caution that open-bed beans may be wetter.
      - 420 kg in 7 bags dispatched 22 June for vessel departing 26 June.
    visuals: [{kind: photo, asset: greenhouse-drying-rain}]
    avoid: [Factory arrival results]

  - id: informe-visita-campo-loma-verde-2026-05
    title: "Informe de visita de campo, Asociación Loma Verde (20 de mayo de 2026)"
    type: field_log
    language: es
    date: 2026-05-20
    author: yanelis-pena
    audience: Association board
    pages: 2
    purpose: Field technician's notes that record the wood-fired dryer beside the drying racks at El Guayabo.
    entities: [origins.inspections.insp-lv-2026-05, origins.farms.el-guayabo, origins.farms.loma-verde-farm]
    content:
      - Handwritten-style notebook page (scan) plus typed transcription.
      - El Guayabo installed a wood-fired dryer after two weeks of rain; chimney about 4 m from the racks; smoke drifts over beans in the afternoon.
      - Recommendation to move racks 30 m upwind and raise the chimney.
      - Loma Verde farm visit with no issues.
    visuals: [{kind: scan, asset: field-notes-scan}, {kind: photo, asset: dryer-chimney-racks}]
    avoid: [Mention of Cocoarynth's tasting results (they come later)]

  - id: sourcing-price-review-2026
    title: "Sourcing price review 2026"
    type: report
    language: en
    date: 2026-09-30
    author: ana-ortega
    audience: Leadership team
    pages: 3
    purpose: Annual comparison of what Cocoarynth pays each origin against the world reference.
    entities: [commercial.prices_landed_usd_kg, commercial.market_reference, commercial.purchases_kg, commercial.contracts]
    content:
      - Landed price per origin 2024–2026 versus world reference; Madagascar highest at USD 13.80.
      - Contract terms - quality bonus, community premium, organic premium suspension, sample-match credit for the rejected Dominican lot.
      - Volumes by origin.
      - Open question for leadership on whether the Madagascar premium is justified (do not answer it).
    visuals: [{kind: chart, asset: landed-price-by-origin}, {kind: chart, asset: purchases-by-origin}]
    avoid: [Sales or tasting results]

  - id: origin-transparency-report-2026
    title: "Cocoarynth Origin Report 2026"
    type: public_report
    language: en
    date: 2026-10-01
    author: ana-ortega
    audience: Public
    pages: 6
    purpose: Public transparency report about where Cocoarynth's cacao comes from.
    entities: [origins.origins, origins.suppliers, origins.farms, commercial.purchases_kg, commercial.prices_landed_usd_kg, commercial.market_reference]
    content:
      - Sourcing philosophy; one profile page per active origin with farm names (no farmer contact details).
      - Average landed price versus world reference (aggregate, not per shipment).
      - New-origin trial in the Dominican Republic described as ongoing.
      - Glossary box.
    visuals: [{kind: map, asset: origins-world-map}, {kind: chart, asset: landed-price-by-origin}, {kind: photo, asset: cacao-pods-ecuador}, {kind: photo, asset: heap-fermentation-ghana}]
    avoid: [Batch-level problems, complaints or rejections]
