index: cocoarynth-origins
description: Origin and farm records - supplier profiles, collection tickets, fermentation and drying logs, inspections, certificates and sourcing prices.

# Brief fields
#   type: template family (report, field_log, scanned_form, inspection_report, letter, memo, trip_report, public_report)
#   entities: world references the document draws facts from
#   content: what the prose must cover; facts come from `entities`
#   avoid: facts or conclusions this document must not state, so mysteries need several sources

briefs:
  - id: origin-profile-ecuador
    title: "Origin profile: Río Claro, Esmeraldas, Ecuador"
    type: report
    language: en
    date: 2026-04-01
    author: ana-ortega
    audience: Cocoarynth staff and retail partners
    pages: 2
    purpose: Introduce the Río Claro cooperative and its member farms.
    entities: [origins.origins.ecuador, origins.suppliers.rio-claro, origins.farms.las-brisas, origins.farms.el-cedro, origins.farms.la-ceiba, commercial.purchases_kg.ecuador]
    content:
      - Cooperative history, 86 members, collection center run by Marisol Vega.
      - The three farms Cocoarynth buys from, with planted hectares and shade.
      - Box fermentation and raised-bed drying; flavor notes.
      - Explain that a single origin can mean several farms, and that lots may combine farms.
      - Volumes bought 2024–2026.
    visuals: [{kind: photo, asset: cacao-pods-ecuador}, {kind: photo, asset: fermentation-boxes}]
    avoid: [Lot codes for specific batches]

  - id: origin-profile-ghana
    title: "Origin profile: Akwapim Ridge, Ghana"
    type: report
    language: en
    date: 2026-04-01
    author: ana-ortega
    audience: Cocoarynth staff and retail partners
    pages: 2
    purpose: Introduce the Akwapim Ridge association and its on-farm heap fermentation.
    entities: [origins.origins.ghana, origins.suppliers.akwapim-ridge, origins.farms.nyamebekyere, origins.farms.adom, origins.farms.asaase, commercial.purchases_kg.ghana]
    content:
      - Association of 140 farmers; secretary Kwabena Asare.
      - Heap fermentation under banana leaves and bamboo-mat drying.
      - Community premium for raised drying frames.
      - Flavor notes and the GH68 bar.
    visuals: [{kind: photo, asset: heap-fermentation-ghana}]
    avoid: []

  - id: origin-profile-peru
    title: "Origin profile: Nuevo Horizonte, Bagua, Peru"
    type: report
    language: en
    date: 2026-04-01
    author: ana-ortega
    audience: Cocoarynth staff and retail partners
    pages: 2
    purpose: Introduce the Nuevo Horizonte cooperative, its centralized fermentary and its organic program.
    entities: [origins.origins.peru, origins.suppliers.nuevo-horizonte, origins.farms.san-isidro, origins.farms.los-laureles, origins.certifications.cert-nh-organic]
    content:
      - 212-member cooperative; quality officer Lucía Huamán.
      - Centralized cascading-box fermentary and solar dryers.
      - Organic certificate CA-ORG-2025-0381 valid until 31 May 2026; renewal inspection planned for April (written before the inspection).
      - Note that Los Laureles borders a neighbor's rice paddy.
    visuals: [{kind: photo, asset: solar-dryer-peru}]
    avoid: [Inspection findings or renewal outcome (profile predates them)]

  - id: origin-profile-madagascar
    title: "Origin profile: Tsaravola Estate, Sambirano Valley, Madagascar"
    type: report
    language: en
    date: 2026-04-01
    author: ana-ortega
    audience: Cocoarynth staff and retail partners
    pages: 2
    purpose: Introduce the single estate behind Cocoarynth's most expensive bar.
    entities: [origins.origins.madagascar, origins.suppliers.tsaravola, origins.farms.tsaravola-river, origins.farms.tsaravola-hillside, commercial.contracts]
    content:
      - Estate managed by Hery Rakotomalala; two parcels.
      - Four-tier box fermentation; greenhouse plus open-bed drying.
      - Two shipments a year from Antsiranana.
      - Red berry and citrus flavor; why Cocoarynth pays an estate price.
      - States plainly that the estate is not certified organic.
    visuals: [{kind: photo, asset: greenhouse-drying-rain}]
    avoid: [2026 harvest problems]

  - id: origin-profile-dominican-republic
    title: "New origin trial: Loma Verde, Hato Mayor, Dominican Republic"
    type: report
    language: en
    date: 2026-03-12
    author: ana-ortega
    audience: Cocoarynth staff
    pages: 1
    purpose: Explain why Cocoarynth is trialing a fifth origin.
    entities: [origins.origins.dominican-republic, origins.suppliers.loma-verde, origins.farms.loma-verde-farm, origins.farms.el-guayabo, beans.lots.DR26-T01, commercial.contracts]
    content:
      - Producer association of 38 farmers; field technician Yanelis Peña.
      - Sample DR26-T01 approved on 10 March; molasses and raisin notes.
      - Plan for a 360 kg trial lot from Finca El Guayabo with a sample-match clause.
    visuals: []
    avoid: [Smoky problems that happen later]

  - id: boletas-acopio-rio-claro-2026
    title: "Boletas de acopio, Cooperativa Río Claro (mayo–junio 2026)"
    type: scanned_form
    language: es
    date: 2026-06-04
    author: marisol-vega
    audience: Cooperative records
    pages: 3
    purpose: Handwritten collection tickets that identify which farm delivered beans to which lot.
    entities: [beans.collection_tickets, beans.lots.EC26-L05, beans.lots.EC26-L07]
    content:
      - One page per ticket - T-0402 (La Ceiba, lot EC26-L05), T-0417 (Las Brisas, lot EC26-L07), T-0418 (El Cedro, lot EC26-L07).
      - Fields - ticket number, date, farmer, farm, wet kg, lot code, notes, signatures.
      - T-0418 has a note that the original got wet in the rain and a legible copy is attached.
      - Short typed cover note in Spanish listing the tickets (text fallback for the scans).
    visuals: [{kind: scan, asset: ticket-scans}]
    avoid: [Batch or wrapper codes]

  - id: registro-fermentacion-ec26-l07
    title: "Registro de fermentación y secado, lote EC26-L07"
    type: field_log
    language: es
    date: 2026-06-19
    author: marisol-vega
    audience: Cooperative and Cocoarynth sourcing
    pages: 2
    purpose: Day-by-day fermentation and drying log for the lot behind the Ecuador wrapper mystery.
    entities: [beans.lots.EC26-L07, origins.farms.las-brisas, origins.farms.el-cedro]
    content:
      - Lot made of 770 kg wet beans from Las Brisas (420) and El Cedro (350).
      - Fermentation 4–10 June with turns every 48 hours and box temperatures (author plausible values, peak about 47 °C).
      - Drying 10–19 June on raised beds; 300 kg dried in 5 bags; dispatched 22 June.
    visuals: []
    avoid: [Batch codes]

