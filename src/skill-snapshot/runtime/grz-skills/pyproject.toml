[build-system]
requires = ["setuptools>=75,<81", "wheel>=0.45,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "grz-skills"
version = "0.1.0"
description = "Agent skills that build and browse GRZ community sidecars in Azure AI Search"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Microsoft"}]
dependencies = ["numpy==2.2.6"]

[project.urls]
Repository = "https://github.com/microsoft/GitHub-Copilot-for-Azure"
Issues = "https://github.com/microsoft/GitHub-Copilot-for-Azure/issues"

[project.optional-dependencies]
azure = ["azure-search-documents==11.6.0", "azure-identity==1.23.0"]
embed = ["fastembed==0.7.3"]

[project.scripts]
grz-build = "grz_build.cli:main"
grz-consume = "grz_consume.cli:main"
grz-mcp = "grz_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grz_adapters = ["sidecar-index.schema.json"]
grz_build = ["profiles/*.json"]
