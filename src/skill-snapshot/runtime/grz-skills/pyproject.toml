[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grz-skills"
version = "0.1.0"
description = "Agent skills that build and browse GRZ community sidecars in Azure AI Search"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Microsoft"}]
dependencies = ["numpy==2.5.3"]

[project.optional-dependencies]
azure = ["azure-search-documents==12.0.0", "azure-identity==1.26.0"]
embed = ["fastembed==0.9.0"]
apps = ["mcp==2.3.0"]

[project.scripts]
grz-build = "grz_build.cli:main"
grz-consume = "grz_consume.cli:main"
grz-mcp = "grz_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grz_adapters = ["sidecar-index.schema.json"]
grz_build = ["profiles/*.json"]
grz_mcp = ["assets/*.html", "assets/*.txt", "assets/*.json"]

[tool.setuptools.data-files]
"share/foundry-iq-skills/grz/bin" = [
  "bin/GRZBuildPoc.exe",
  "bin/checksums.sha256",
  "bin/config.example.json",
  "bin/README.md",
  "bin/PACKAGING-AND-SIGNING.md",
]
"share/foundry-iq-skills/grz/bin/linux-x64" = ["bin/linux-x64/GRZBuildPoc", "bin/linux-x64/checksums.sha256"]
"share/foundry-iq-skills/grz/bin/linux-arm64" = ["bin/linux-arm64/GRZBuildPoc", "bin/linux-arm64/checksums.sha256"]
"share/foundry-iq-skills/grz/bin/osx-x64" = ["bin/osx-x64/GRZBuildPoc", "bin/osx-x64/checksums.sha256"]
"share/foundry-iq-skills/grz/bin/osx-arm64" = ["bin/osx-arm64/GRZBuildPoc", "bin/osx-arm64/checksums.sha256"]
