[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "grounding-skills"
version = "0.1.0"
description = "Agent skills to create, load and verify an Azure AI Search grounding index (edgeList graph profile)"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "Microsoft"}]
dependencies = ["azure-identity==1.26.0", "azure-mgmt-search==9.2.0", "httpx==0.28.1"]

[project.optional-dependencies]
parquet = ["pyarrow==25.0.1"]

[project.scripts]
grounding-provision = "grounding.cli_provision:main"
grounding-build = "grounding.cli_build:main"
grounding-consume = "grounding.cli_consume:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["grounding*"]
namespaces = false
