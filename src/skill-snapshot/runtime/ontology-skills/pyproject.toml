[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ontology-skills"
version = "0.1.0"
description = "Agent skills that propose and review ontologies from a published GRZ community generation, then export OWL or inline-compatible JSON-LD"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "azure-identity==1.26.0",
  "azure-search-documents==12.0.0",
  "requests==2.34.2",
  "rdflib==7.6.0",
]

[project.optional-dependencies]
apps = ["mcp==2.3.0"]

[project.scripts]
ontology-build = "ontology_build.cli:main"
ontology-consume = "ontology_consume.cli:main"
ontology-apps = "ontology_apps.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ontology_core = ["schemas/*.json"]
ontology_apps = ["ui/*.html", "ui/*.THIRD_PARTY_NOTICES.txt", "ui/build-provenance.json", "ui/bundle-report.json"]
