<svg viewBox="0 0 920 180" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="triple-graph-title triple-graph-desc">
  <title id="triple-graph-title">Two triples connected through a bean lot</title>
  <desc id="triple-graph-desc">Batch EC26-0811 points to bean lot EC26-L07 through madeFrom. A farm points to the same bean lot through contributedTo.</desc>
  <defs>
    <marker id="triple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24292f" />
    </marker>
  </defs>
  <g fill="#ffffff" stroke="#24292f" stroke-width="3">
    <rect x="20" y="50" width="250" height="80" rx="8" />
    <rect x="350" y="40" width="240" height="100" rx="8" />
    <rect x="710" y="50" width="190" height="80" rx="8" />
  </g>
  <g fill="#24292f" font-family="Segoe UI, sans-serif" font-size="20" text-anchor="middle">
    <text x="145" y="84">Batch</text>
    <text x="145" y="112" font-weight="600">EC26-0811</text>
    <text x="470" y="79">Bean lot</text>
    <text x="470" y="111" font-weight="600">EC26-L07</text>
    <text x="805" y="99">Farm</text>
  </g>
  <g fill="none" stroke="#24292f" stroke-width="3" marker-end="url(#triple-arrow)">
    <path d="M 270 90 L 348 90" />
    <path d="M 710 90 L 592 90" />
  </g>
  <g fill="#24292f" font-family="Segoe UI, sans-serif" font-size="15" text-anchor="middle">
    <text x="309" y="76">madeFrom</text>
    <text x="651" y="76">contributedTo</text>
  </g>
</svg>
